<style>
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #1A2744 transparent; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1A2744; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #1E3050; }
  body { margin:0; background:#070B12; color:#E2E8F0; font-family:'IBM Plex Sans',sans-serif; overflow:hidden; }

  .bg-grid {
    background-image: linear-gradient(rgba(0,180,216,0.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,180,216,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glass { background:rgba(13,21,38,0.75); backdrop-filter:blur(12px); border:1px solid rgba(26,39,68,0.8); }
  .glass-bright { background:rgba(17,27,46,0.85); backdrop-filter:blur(16px); border:1px solid rgba(30,48,80,0.7); }
  .glow-border { box-shadow:0 0 0 1px rgba(0,240,255,0.08), inset 0 0 30px rgba(0,240,255,0.015); }
  .glow-cyan { box-shadow:0 0 12px rgba(0,240,255,0.15); }
  .glow-red { box-shadow:0 0 8px rgba(255,59,59,0.2); }
  .glow-green { box-shadow:0 0 8px rgba(0,255,136,0.15); }

  .sidebar-item { display:flex; align-items:center; gap:10px; padding:7px 14px; border-radius:6px;
    font-size:12.5px; color:#8899AA; cursor:pointer; transition:all .15s; border:1px solid transparent; }
  .sidebar-item:hover { color:#E2E8F0; background:rgba(0,240,255,0.04); }
  .sidebar-item.active { color:#00F0FF; background:rgba(0,240,255,0.07); border-color:rgba(0,240,255,0.12); }
  .sidebar-item.active svg { color:#00F0FF; }

  .severity-high { color:#FF3B3B; background:rgba(255,59,59,0.1); border:1px solid rgba(255,59,59,0.2); }
  .severity-medium { color:#FFB800; background:rgba(255,184,0,0.1); border:1px solid rgba(255,184,0,0.2); }
  .severity-low { color:#00B4D8; background:rgba(0,180,216,0.1); border:1px solid rgba(0,180,216,0.2); }
  .severity-info { color:#8899AA; background:rgba(136,153,170,0.08); border:1px solid rgba(136,153,170,0.15); }

  .tab-btn { padding:6px 14px; font-size:12px; border-radius:5px; color:#8899AA; cursor:pointer;
    transition:all .15s; border:1px solid transparent; background:transparent; }
  .tab-btn:hover { color:#E2E8F0; }
  .tab-btn.active { color:#00F0FF; background:rgba(0,240,255,0.07); border-color:rgba(0,240,255,0.15); }

  .data-row { display:grid; grid-template-columns:140px 1fr; gap:4px 12px; padding:4px 0;
    border-bottom:1px solid rgba(26,39,68,0.4); font-size:12px; }
  .data-row:last-child { border-bottom:none; }
  .data-label { color:#556677; font-family:'JetBrains Mono',monospace; font-size:11px; }
  .data-value { color:#E2E8F0; font-family:'JetBrains Mono',monospace; font-size:11.5px; word-break:break-all; }

  .code-line { display:grid; grid-template-columns:52px 70px 1fr; gap:0; padding:1px 0; font-size:12px;
    font-family:'JetBrains Mono',monospace; line-height:1.7; cursor:default; border-left:2px solid transparent; }
  .code-line:hover { background:rgba(0,240,255,0.03); }
  .code-line.suspicious { background:rgba(255,59,59,0.06); border-left-color:#FF3B3B; }
  .code-line.suspicious:hover { background:rgba(255,59,59,0.1); }
  .code-line.selected { background:rgba(0,240,255,0.08); border-left-color:#00F0FF; }
  .code-line .ln { color:#3A4A5E; text-align:right; padding-right:12px; user-select:none; font-size:11px; }
  .code-line .addr { color:#556677; user-select:none; font-size:11px; }
  .code-line .instr { color:#8899AA; }
  .code-line .instr .op { color:#00B4D8; }
  .code-line .instr .reg { color:#00FF88; }
  .code-line .instr .num { color:#FF6B35; }
  .code-line .instr .str { color:#FFB800; }
  .code-line .instr .cmt { color:#3A4A5E; font-style:italic; }
  .code-line.suspicious .instr .op { color:#FF3B3B; }

  .timeline-item { display:grid; grid-template-columns:80px 8px 1fr; gap:0 12px; padding:5px 0; font-size:12px; }
  .timeline-time { color:#556677; font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right; padding-top:1px; }
  .timeline-dot { position:relative; }
  .timeline-dot::before { content:''; position:absolute; left:2px; top:6px; width:5px; height:5px;
    border-radius:50%; background:#1A2744; }
  .timeline-dot.event-red::before { background:#FF3B3B; box-shadow:0 0 6px rgba(255,59,59,0.4); }
  .timeline-dot.event-orange::before { background:#FF6B35; box-shadow:0 0 6px rgba(255,107,53,0.4); }
  .timeline-dot.event-yellow::before { background:#FFB800; box-shadow:0 0 6px rgba(255,184,0,0.3); }
  .timeline-dot.event-blue::before { background:#00B4D8; box-shadow:0 0 6px rgba(0,180,216,0.3); }
  .timeline-dot.event-green::before { background:#00FF88; box-shadow:0 0 6px rgba(0,255,136,0.3); }
  .timeline-line { position:absolute; left:4px; top:14px; bottom:-5px; width:1px; background:#1A2744; }

  .finding-card { padding:10px 12px; border-radius:6px; border:1px solid rgba(26,39,68,0.6);
    background:rgba(13,21,38,0.5); cursor:pointer; transition:all .15s; }
  .finding-card:hover { border-color:rgba(0,240,255,0.15); background:rgba(13,21,38,0.8); }
  .finding-card.active { border-color:rgba(0,240,255,0.25); background:rgba(0,240,255,0.04); }

  .stat-card { position:relative; overflow:hidden; }
  .stat-card::after { content:''; position:absolute; top:0; right:0; width:60px; height:60px;
    border-radius:50%; filter:blur(30px); opacity:0.08; pointer-events:none; }
  .stat-card.sc-cyan::after { background:#00F0FF; }
  .stat-card.sc-red::after { background:#FF3B3B; }
  .stat-card.sc-yellow::after { background:#FFB800; }
  .stat-card.sc-orange::after { background:#FF6B35; }

  .process-tree-node { padding:3px 8px; font-size:11.5px; font-family:'JetBrains Mono',monospace;
    border-radius:4px; display:inline-flex; align-items:center; gap:6px; }
  .process-tree-node.malicious { background:rgba(255,59,59,0.1); border:1px solid rgba(255,59,59,0.2); color:#FF3B3B; }
  .process-tree-node.injected { background:rgba(255,107,53,0.1); border:1px solid rgba(255,107,53,0.2); color:#FF6B35; }
  .process-tree-node.normal { background:rgba(0,180,216,0.06); border:1px solid rgba(0,180,216,0.15); color:#8899AA; }

  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes scan-line { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }

  @media (max-width:1024px) {
    #sidebar { position:fixed; z-index:50; transform:translateX(-100%); transition:transform .2s; }
    #sidebar.open { transform:translateX(0); }
    #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; }
    #sidebar-overlay.show { display:block; }
  }
</style>
</head>

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  state.sidebarOpen = !state.sidebarOpen;
  sb.classList.toggle('open', state.sidebarOpen);
  ov.classList.toggle('show', state.sidebarOpen);

function navigate(page) {
  state.page = page;
  state.selectedFinding = 'f1';
  state.selectedCodeLine = null;
  if (state.sidebarOpen) toggleSidebar();
  render();
}

  state.selectedCodeLine = idx;

}

function sevBadge(sev) {
  const cls = sev==='HIGH'?'severity-high':sev==='MEDIUM'?'severity-medium':sev==='LOW'?'severity-low':'severity-info';
  return `<span class="${cls} text-[10px] font-mono font-semibold px-2 py-0.5 rounded">${sev}</span>`;
}
function riskBadge(risk) {
  const map = {'CRITICAL':'bg-cs-red/15 text-cs-red border-cs-red/25','HIGH':'bg-cs-orange/15 text-cs-orange border-cs-orange/25','MEDIUM':'bg-cs-yellow/15 text-cs-yellow border-cs-yellow/25','LOW':'bg-cs-blue/15 text-cs-blue border-cs-blue/25','Benign':'bg-cs-green/15 text-cs-green border-cs-green/25','Malicious':'bg-cs-red/15 text-cs-red border-cs-red/25'};
  const cls = map[risk] || map['LOW'];
  return `<span class="${cls} text-[10px] font-mono font-semibold px-2 py-0.5 rounded border">${risk}</span>`;
}
function statusBadge(s) {
  const map = {'Complete':'text-cs-green','Analyzing':'text-cs-yellow','Queued':'text-cs-text3','Injected':'text-cs-orange','Malicious':'text-cs-red','Normal':'text-cs-text2','Established':'text-cs-green','Closed':'text-cs-text3'};
  return `<span class="text-[11px] font-mono ${map[s]||'text-cs-text2'}">${s}</span>`;
}

  nav.innerHTML = NAV_ITEMS.map(item => {
    if (item.id.startsWith('divider')) return '<div class="my-2 border-t border-cs-border/50"></div>';
    return `<div class="sidebar-item ${state.page===item.id?'active':''}" onclick="navigate('${item.id}')">
      <i data-lucide="${item.icon}" class="w-[15px] h-[15px] flex-shrink-0"></i><span>${item.label}</span>
    </div>`;
  }).join('');
  lucide.createIcons();
}

// ============================================================
// 页面路由
// ============================================================
function render() {
  renderSidebar();
  document.getElementById('topbar-page').textContent = NAV_ITEMS.find(i=>i.id===state.page)?.label || 'Dashboard';
  renderPage();
}

function renderPage() {
  destroyCharts();
  const c = document.getElementById('page-container');
  const pages = { dashboard:renderDashboard, upload:renderUpload, history:renderHistory, intelligence:renderIntelligence,
    static:renderStaticPage, dynamic:renderDynamicPage, memory:renderMemoryPage, network:renderNetworkPage,
    ioc:renderIOCPage, reports:renderReportPage, settings:renderSettingsPage, sample:renderSamplePage };
  c.innerHTML = (pages[state.page] || renderDashboard)();
  lucide.createIcons();
  initPageCharts();
}

        <div class="flex items-center gap-2 mb-1.5">
          ${sevBadge(f.severity)}

    </div>
